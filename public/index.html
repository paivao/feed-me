<!DOCTYPE html>
<html lang="en" class="has-navbar-fixed-top">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/axios.min.js"></script>
    <script src="js/alpine.min.js" defer></script>
    <script src="js/app.js"></script>
    <link href="css/bulma.min.css" rel="stylesheet">
    <title>Feed-Me</title>
    <style>
        .fullscreen {
            height: 100vh;
        }
    </style>
</head>

<body x-data="app()">

    <!-- Authentication Section -->
    <template x-if="user === null" x-cloak>
        <section class="columns is-vcentered is-centered is-mobile has-text-centered fullscreen">
            <div class="column is-narrow">
                <h1 class="title">Feed-Me</h1>
                <h2 class="subtitle">Login</h2>
                <form @submit.prevent="await login()" class="box">
                    <div class="field mb-4">
                        <label for="input-username" class="label">Usuário</label>
                        <div class="control">
                            <input type="text" x-model="loginData.username" id="input-username" class="input" required>
                        </div>
                    </div>
                    <div class="field mb-4">
                        <label for="input-password" class="label">Senha</label>
                        <div class="control">
                            <input type="password" x-model="loginData.password" id="input-password" class="input"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="button is-link is-fullwidth">Login</button>
                </form>
            </div>
        </section>
    </template>

    <template x-if="user !== null" x-cloak>
        <div>
            <nav class="navbar is-light is-fixed-top" role="navigation" aria-label="main navigation">
                <div class="navbar-brand">
                    <span class="navbar-item">
                        Feed-Me
                    </span>
                </div>
                <div class="navbar-menu">
                    <div class="navbar-end">
                        <div class="navbar-item">
                            Bem vindo,&nbsp;<span x-text="user.name"></span>
                        </div>
                        <div class="navbar-item">
                            <div class="buttons">
                                <a class="button is-primary">Gerenciar</a>
                                <button @click="await logout()" class="button is-danger">Logout</button>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>


            <!-- CRUD Operations -->
            <template x-if="selectedFeed === null">
                <main class="container mt-6">
                    <h1 class="title">Manage Feeds</h1>
                    <div class="columns">
                        <div class="column is-two-thirds">
                            <div class="table-container">
                                <table class="table is-fullwidth">
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th>Tipo</th>
                                            <th>Descrição</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="feed in feeds" :key="feed.id">
                                            <tr :class="feed.is_public ? '' : 'is-light'">
                                                <td x-text="feed.name"></td>
                                                <td x-text="FEED_DATA_TYPE[feed.type]"></td>
                                                <td x-text="feed.description"></td>
                                                <td>
                                                    <button @click="feedMarkToEdit(feed)"
                                                        class="button is-info is-small">Editar</button>
                                                    <button @click="await removeFeed(feed)"
                                                        class="button is-danger is-small">Remover</button>
                                                    <button @click="await showEntries(feed)"
                                                        class="button is-success is-small ml-2">Ver Entradas</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="column">
                            <form @submit.prevent="await submitFeed()" @reset.prevent="resetFeed()" class="box">
                                <h2 x-text="feedActionName() + ' Feed'"></h2>
                                <div class="field">
                                    <label for="input-feed-name" class="label">Nome do feed</label>
                                    <div class="control">
                                        <input type="text" x-model="newFeed.name" placeholder="Nome do novo feed"
                                            class="input" id="input-feed-name" required :readonly="!feedFormCreate">
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="input-feed-description" class="label">Descrição</label>
                                    <div class="control">
                                        <input type="text" x-model="newFeed.description" placeholder="Comentário"
                                            class="input" id="input-feed-description">
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="input-feed-type" class="label">Tipo de Feed</label>
                                    <div class="select" id="input-feed-type">
                                        <select x-model="newFeed.feed_type" :readonly="!feedFormCreate">
                                            <template x-for="(fv, fn) in FEED_DATA_TYPE">
                                                <option :value="fv" x-text="fn"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                                <div class="field">
                                    <label class="checkbox">
                                        <input id="input-feed-is-public" type="checkbox" x-model="newFeed.is_public" />
                                        É público?
                                    </label>
                                </div>
                                <button type="submit" class="button is-success" x-text="feedActionName()"></button>
                                <button type="reset" class="button is-light">Cancelar</button>
                            </form>
                        </div>
                    </div>
                </main>
            </template>
            <template x-if="selectedFeed !== null">
                <main class="container mt-6">
                    <div class="card">
                        <header class="card-header">
                            <p class="card-header-title" x-text="selectedFeed.name"></p>
                            <button class="card-header-icon" aria-label="more options" @click="unselectFeed()">
                                <span class="icon">
                                    &#8617;
                                </span>
                            </button>
                        </header>
                    </div>
                    <div class="columns">
                        <div class="column is-two-thirds">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Valor</th>
                                        <th>Descrição</th>
                                        <th>Válido Até</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="entry in entries" :key="entry.id">
                                        <tr :class="entry.enabled ? '' : 'is-danger'">
                                            <td x-text="entry.value"></td>
                                            <td x-text="feed.description"></td>
                                            <td x-text="feed.valid_until"></td>
                                            <td>
                                                <button @click="await editEntry(entry)"
                                                    class="button is-info is-small ml-2">Editar</button>
                                                <button @click="await removeEntry(entry)"
                                                    class="button is-danger is-small">Remover</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <div class="buttons">
                                <button class="button" x-show="entryPagination.page > 0">Primeira página</button>
                                <button class="button" x-show="entryPagination.page > 1">Anterior</button>
                                <button class="button" x-text="'Página ' + entryPagination.page" disabled></button>
                                <button class="button" x-show="entryPagination.page < entryPagination.lastPage() - 1">Próxima</button>
                                <button class="button" x-show="entryPagination.page < entryPagination.lastPage()">Última Página</button>
                            </div>
                        </div>
                        <div class="column">
                            <form @submit.prevent="await submitEntry()" @reset.prevent="resetEntry()" class="box">
                                <h2 x-text="entryActionName() + ' Entrada'"></h2>
                                <div class="field">
                                    <label for="input-entry-value" class="label">Valor</label>
                                    <div class="control">
                                        <input type="text" x-model="newEntry.value" placeholder="Valor da entrada"
                                            class="input" id="input-entry-value" required :readonly="!entryFormCreate">
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="input-entry-description" class="label">Descrição</label>
                                    <div class="control">
                                        <input type="text" x-model="newEntry.description" placeholder="Comentário"
                                            class="input" id="input-entry-description">
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="input-entry-description" class="label">Valido até?</label>
                                    <div class="control">
                                        <input type="datetime-local" x-model="newEntry.valid_until" placeholder="Valido até"
                                            class="input" id="input-entry-description">
                                    </div>
                                    <button class="button" @click.prevent="limparValidade()"></button>
                                </div>
                                <div class="field">
                                    <label class="checkbox">
                                        <input type="checkbox" x-model="newEntry.enabled" /> Habilitado?
                                    </label>
                                </div>
                                <button type="submit" class="button is-success" x-text="entryActionName()"></button>
                                <button type="reset" class="button is-light">Cancelar</button>
                            </form>
                        </div>
                    </div>
                </main>
            </template>
        </div>
    </template>
</body>

</html>
