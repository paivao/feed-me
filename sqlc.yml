version: "2"
sql:
  - engine: "mysql"
    queries: "queries.sql"
    schema: "schema.sql"
    gen:
      go:
        out: "database"
        emit_json_tags: true
        omit_unused_structs: true
        query_parameter_limit: 1
        overrides:
          - column: ip_entries.value
            go_type:
              import: "github.com/feed-me/utils"
              type: MyNet