version: "2"
sql:
  - engine: "mysql"
    queries: "sql/queries"
    schema: "sql/schema"
    gen:
      go:
        out: "database"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        omit_unused_structs: true
        emit_enum_valid_method: true
        query_parameter_limit: 4
        overrides:
          - column: ip_entries.value
            go_type:
              import: "github.com/feed-me/types"
              type: MyNet